    <meta charset="UTF-8" />
    <script>
      (function() {
        function shouldSuppress(item) {
          if (!item) return false;
          var str = '';
          try {
            if (typeof item === 'string') {
              str = item;
            } else if (item instanceof Error) {
              str = (item.message || '') + ' ' + (item.stack || '');
            } else {
              str = (item.message || '') + ' ' + (item.stack || '') + ' ' + JSON.stringify(item);
            }
          } catch (_) {
            str = String(item);
          }
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        }

        function checkArgs(args) {
          for (var i = 0; i < args.length; i++) {
            if (shouldSuppress(args[i])) return true;
          }
          return false;
        }

        var origConsoleError = console.error;
        console.error = function() {
          if (checkArgs(arguments)) return;
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          if (checkArgs(arguments)) return;
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (
            shouldSuppress(e.message) ||
            shouldSuppress(e.filename) ||
            shouldSuppress(e.error)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
